[pytest]
testpaths = tests

# The v0.8.0 suite uses the conventional test_*.py names. The two older suites
# are named *_test_suite.py and are still collected by name; the benchmark,
# scaling and visualization suites are scripts, not pytest modules, and are
# deliberately left out.
python_files =
    test_*.py
    DataTypical_unit_test_suite.py
    DataTypical_autodetection_test_suite.py

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
