[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robustpixelmaker"
dynamic = ["version"]
description = "Reproducible, leakage-safe pixel/patch feature selection for registered scientific images: the image sibling of RobustModelMaker"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Amanda S. Barnard", email = "amanda.s.barnard@anu.edu.au" },
]
keywords = [
    "feature selection",
    "stability selection",
    "scientific imaging",
    "reproducibility",
    "nested cross-validation",
    "image analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
parallel = ["joblib>=1.1"]
plots = ["matplotlib>=3.5"]
benchmarks = ["pandas>=1.4", "matplotlib>=3.5"]
test = ["pytest>=7"]
dev = ["pytest>=7", "joblib>=1.1", "matplotlib>=3.5", "pandas>=1.4", "mypy>=1.0"]
all = ["joblib>=1.1", "matplotlib>=3.5", "pandas>=1.4", "pytest>=7", "mypy>=1.0"]

[project.urls]
Homepage = "https://github.com/amaxiom/RobustPixelMaker"
Changelog = "https://github.com/amaxiom/RobustPixelMaker/blob/main/CHANGELOG.md"
Documentation = "https://github.com/amaxiom/RobustPixelMaker/blob/main/README.md"
"Bug Tracker" = "https://github.com/amaxiom/RobustPixelMaker/issues"
Repository = "https://github.com/amaxiom/RobustPixelMaker"
"RobustMaker (tabular)" = "https://github.com/amaxiom/RobustModelMaker"
"RobustMaker (signals)" = "https://github.com/amaxiom/RobustSignalMaker"
"Related (benchmarking)" = "https://github.com/amaxiom/benchmake"

[tool.setuptools]
packages = ["robustpixelmaker"]

[tool.setuptools.dynamic]
version = { attr = "robustpixelmaker.__version__" }

[tool.setuptools.package-data]
robustpixelmaker = ["py.typed"]
